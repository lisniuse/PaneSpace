name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and run layout checks
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Publish and verify production single EXE
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipTests -VerifyPackage
